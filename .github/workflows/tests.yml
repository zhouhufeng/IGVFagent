# Offline self-tests on a clean install, on every push and pull request.
#
# Runs Scripts/run_selftests.py, which executes every Scripts/test_*.py with
# network access blocked and no credentials, so a green badge means each
# skill's self-test passed from a fresh `pip install` alone. Python 3.9 is the
# supported floor (and the local development version); 3.11 is what the
# hosted container runs.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftests:
    name: self-tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[analysis,ui,llm]'

      - name: Run self-tests (network blocked)
        env:
          MPLBACKEND: Agg
        run: python Scripts/run_selftests.py
