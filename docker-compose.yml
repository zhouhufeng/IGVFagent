# IGVFagent + Ollama (Qwen 3) stack.
#
#   docker compose up                       # build + start everything
#   docker compose --profile bootstrap up   # also pull qwen3:8b model
#   docker compose run --rm agent kg gene APOE
#   docker compose down                     # stop (volumes preserved)
#
# The agent service auto-resolves the in-network Ollama daemon via
# OLLAMA_HOST_BASE; no host-side LLM install required. Pass real API
# keys for cloud backends through a .env file (gitignored):
#
#   echo 'ANTHROPIC_API_KEY=sk-ant-...' >> .env
#   echo 'OPENAI_API_KEY=sk-...'         >> .env

services:

  ollama:
    image: ollama/ollama:latest
    container_name: igvf-ollama
    volumes:
      - ollama-data:/root/.ollama
    # Optional: expose to host for direct `curl http://localhost:11434/api/tags`
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s

  # First-run helper: pulls the default Qwen 3 8B model into the
  # ollama volume. Run with `docker compose --profile bootstrap up`
  # once after `docker compose up`. Re-runs are safe (idempotent).
  bootstrap:
    image: ollama/ollama:latest
    profiles: ["bootstrap"]
    container_name: igvf-bootstrap
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["ollama"]
    command: ["pull", "qwen3:8b"]
    restart: "no"

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: igvfagent:latest
    container_name: igvf-agent
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Default LLM backend: the in-network Ollama daemon.
      # If you'd rather use the Ollama you already run natively on the
      # host (which has access to all your RAM and pulled models), put
      # this in your .env:
      #   OLLAMA_HOST_BASE=http://host.docker.internal:11434/v1
      # The `extra_hosts` line below makes that resolve on Linux too.
      IGVF_LLM_BACKEND: ${IGVF_LLM_BACKEND:-ollama}
      OLLAMA_HOST_BASE: ${OLLAMA_HOST_BASE:-http://ollama:11434/v1}
      # Pin a specific Ollama model (e.g. for the 35B coding tunes you
      # already have on the host).
      IGVF_LLM_MODEL:       ${IGVF_LLM_MODEL:-}
      # Per-request timeout (seconds) — bump this if loading a big
      # local model takes longer than the default.
      IGVF_LLM_TIMEOUT:     ${IGVF_LLM_TIMEOUT:-}
      # Forward optional credentials from the host .env file.
      ANTHROPIC_API_KEY:    ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY:       ${OPENAI_API_KEY:-}
      GROQ_API_KEY:         ${GROQ_API_KEY:-}
      TOGETHER_API_KEY:     ${TOGETHER_API_KEY:-}
      DEEPINFRA_API_KEY:    ${DEEPINFRA_API_KEY:-}
      HF_TOKEN:             ${HF_TOKEN:-}
      IGVF_PORTAL_COOKIE:   ${IGVF_PORTAL_COOKIE:-}
      IGVF_ARANGO_PASSWORD: ${IGVF_ARANGO_PASSWORD:-}
    volumes:
      - ./Data:/workspace/Data
      - ./Docs:/workspace/Docs
    ports:
      - "8501:8501"
    # Lets `host.docker.internal` resolve from inside the container on
    # Linux (it already works on Docker Desktop for macOS / Windows).
    # Required when OLLAMA_HOST_BASE points back at the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  ollama-data:
